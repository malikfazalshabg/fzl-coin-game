<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FZL Cat Kombat Bot</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        .header {
            width: 100%;
            padding: 8px 12px;
            background: #121620;
            border-bottom: 2px solid #1f293d;
            z-index: 10;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #1a2233;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #2a3447;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .user-avatar-sm {
            width: 22px;
            height: 22px;
            background: #334155;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .top-right-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .icon-top-btn {
            background: #1a2233;
            border: 1px solid #2a3447;
            color: #fff;
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .exchange-badge {
            background: #1f293d;
            padding: 4px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #f3ba2f;
            border: 1px solid #334155;
            font-weight: bold;
        }
        .profit-badge {
            background: #1a2233;
            padding: 4px 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #e2e8f0;
            border: 1px solid #2a3447;
        }
        .level-progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }
        .level-bar-bg {
            flex: 1;
            background: #1e293b;
            height: 5px;
            border-radius: 3px;
            margin-left: 8px;
            overflow: hidden;
        }
        .level-bar-fill {
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, #f3ba2f, #fb923c);
            border-radius: 3px;
        }

        /* 3 Reward Cards Row */
        .cards-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            gap: 6px;
            background: #0f141f;
        }
        .reward-card {
            flex: 1;
            background: #151b2b;
            border: 1px solid #22304a;
            border-radius: 10px;
            padding: 6px 4px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }
        .reward-card::after {
            content: '✔';
            position: absolute;
            top: 3px;
            right: 5px;
            font-size: 9px;
            color: #22c55e;
            background: rgba(34, 197, 94, 0.15);
            border-radius: 50%;
            width: 12px;
            height: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reward-card-title {
            font-size: 10px;
            font-weight: bold;
            color: #e2e8f0;
            margin-bottom: 2px;
        }
        .reward-card-time {
            font-size: 9px;
            color: #94a3b8;
        }

        /* FZL Balance Display */
        .balance-container {
            text-align: center;
            margin: 2px 0;
        }
        .coin-amount {
            font-size: 34px;
            font-weight: 800;
            color: #f3ba2f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-shadow: 0 0 15px rgba(243, 186, 47, 0.3);
        }

        /* Main Tap Area with Shorts Sidebar Layout */
        .tap-main-wrapper {
            display: flex;
            flex: 1;
            position: relative;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }

        .tap-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        /* Hamster Circle & Cute DP Design */
        .hamster-circle-glow {
            width: 230px;
            height: 230px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(15, 23, 42, 0) 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.2);
            border: 2px solid rgba(59, 130, 246, 0.4);
        }
        .hamster-avatar-box {
            width: 170px;
            height: 170px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 4px solid #f3ba2f;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: transform 0.06s ease;
            position: relative;
        }
        .hamster-avatar-box:active {
            transform: scale(0.93);
        }
        .hamster-face {
            font-size: 48px;
            margin-top: 4px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .hamster-suit-body {
            background: linear-gradient(180deg, #2563eb, #1d4ed8);
            width: 100px;
            height: 55px;
            border-radius: 35px 35px 10px 10px;
            margin-top: -6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #60a5fa;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2);
        }
        .hamster-collar {
            width: 26px;
            height: 10px;
            background: #ffffff;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }
        .hamster-tie {
            width: 7px;
            height: 26px;
            background: #ef4444;
            clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
            margin-top: -2px;
        }

        /* Right Side YouTube Shorts Action Buttons */
        .shorts-sidebar {
            position: absolute;
            right: 5px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 5;
        }
        .short-action-btn {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            font-size: 11px;
            gap: 2px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .short-action-btn span.icon {
            font-size: 22px;
            background: rgba(0, 0, 0, 0.4);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bottom Channel Info Overlay */
        .channel-info-overlay {
            position: absolute;
            left: 12px;
            bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 5;
            max-width: 65%;
        }
        .channel-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .channel-dp {
            width: 30px;
            height: 30px;
            background: #f3ba2f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 1.5px solid #fff;
        }
        .channel-name {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .subscribe-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .video-title {
            font-size: 12px;
            color: #e2e8f0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Flying FZL Coin Animation */
        .flying-coin {
            position: fixed;
            font-size: 22px;
            z-index: 9999;
            pointer-events: none;
            animation: flyToBinance 0.65s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
        }
        @keyframes flyToBinance {
            0% { transform: scale(1) translate(0, 0); opacity: 1; }
            100% { transform: scale(0.3) translate(var(--dx), var(--dy)); opacity: 0; }
        }

        /* Energy Bar */
        .energy-wrapper {
            width: 90%;
            margin: 4px auto 8px auto;
        }
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .energy-track {
            width: 100%;
            background: #1a2233;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #2a3447;
        }
        .energy-fill {
            width: 85%;
            background: linear-gradient(90deg, #f3ba2f, #fbbf24);
            height: 100%;
            border-radius: 4px;
            transition: width 0.2s;
        }

        /* Bottom Navigation Footer */
        .nav-footer {
            display: flex;
            justify-content: space-around;
            background: #121620;
            padding: 6px 0 10px 0;
            border-top: 2px solid #1f293d;
            z-index: 10;
        }
        .nav-btn {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 10px;
            text-align: center;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .nav-btn span.icon {
            font-size: 18px;
        }
        .nav-btn.active, .nav-btn:hover {
            color: #ffffff;
        }
        .nav-btn.center-add span.icon {
            background: #ffffff;
            color: #0b0e14;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* Modals Design */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #121620;
            border: 2px solid #f3ba2f;
            border-radius: 16px;
            padding: 20px;
            width: 88%;
            max-width: 360px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .close-modal {
            position: absolute;
            top: 12px;
            right: 15px;
            cursor: pointer;
            font-size: 18px;
            color: #f3ba2f;
            font-weight: bold;
        }
        .modal-box h3 {
            margin-top: 0;
            color: #f3ba2f;
            font-size: 18px;
        }
        .modal-input {
            width: 100%;
            padding: 10px;
            background: #1a2233;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 14px;
        }
        .modal-btn {
            width: 100%;
            padding: 10px;
            background: #f3ba2f;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
