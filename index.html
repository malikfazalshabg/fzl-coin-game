<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FZL Coin - Royal Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: linear-gradient(180deg, #090715 0%, #160e33 50%, #090715 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .header {
            padding: 25px 10px 0;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 2px;
            color: #f3ba2f;
            text-shadow: 0 0 15px rgba(243, 186, 47, 0.6);
            font-weight: 800;
        }
        .score-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .score-container span:first-child {
            margin-right: 8px;
            font-size: 32px;
        }
        .game-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* یہاں تصویر کو بالکل پرفیکٹ گول شکل دی گئی ہے بغیر کسی اضافی فریم کے تاکہ آپ کا اصلی ڈیزائن نظر آئے */
        .coin-btn {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: #000;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.4);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.06s ease, box-shadow 0.06s ease;
            position: relative;
            outline: none;
            overflow: hidden;
        }
        .coin-btn:active {
            transform: scale(0.93);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.7);
        }
        .coin-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .coin-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .energy-container {
            width: 82%;
            margin-top: 30px;
            background: rgba(20, 14, 45, 0.7);
            padding: 12px 15px;
            border-radius: 15px;
            border: 1px solid rgba(243, 186, 47, 0.2);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e0d9ff;
        }
        .energy-bar {
            width: 100%;
            height: 10px;
            background-color: #0b071a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(243, 186, 47, 0.3);
        }
        .energy-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #f3ba2f, #ffeb3b);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .footer-nav {
            display: flex;
            justify-content: space-around;
            background-color: #0c081f;
            padding: 14px 0;
            border-top: 1px solid rgba(243, 186, 47, 0.15);
        }
        .nav-item {
            color: #7c73a8;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: #f3ba2f;
            text-shadow: 0 0 8px rgba(243, 186, 47, 0.4);
        }
        .nav-icon {
            font-size: 22px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FZL COIN</h1>
        <div class="score-container">
            <span>🪙</span>
            <span id="score">0</span>
        </div>
    </div>

    <div class="game-body">
        <div class="coin-btn" onclick="tapCoin(event)">
            <div class="coin-inner">
                <!-- آپ کی بھیجی گئی اصل منڈالا لائن آرٹ والی رائل شیر کی تصویر -->
                <img src="https://i.ibb.co/68v9N2w/lion-mandala.jpg" alt="Royal Lion Logo" id="coin-image" onerror="this.src='https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?q=80&w=600&auto=format&fit=crop'">
            </div>
        </div>

        <div class="energy-container">
            <div class="energy-info">
                <span>⚡ Energy</span>
                <span id="energy-text">1000 / 1000</span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energy-fill"></div>
            </div>
        </div>
    </div>

    <div class="footer-nav">
        <div class="nav-item active">
            <div class="nav-icon">🪙</div>
            <div>Tap</div>
        </div>
        <div class="nav-item" onclick="alert('Earn section coming soon!')">
            <div class="nav-icon">⛏️</div>
            <div>Earn</div>
        </div>
        <div class="nav-item" onclick="alert('Friends referral system coming soon!')">
            <div class="nav-icon">👥</div>
            <div>Friends</div>
        </div>
        <div class="nav-item" onclick="alert('Wallet integration coming soon!')">
            <div class="nav-icon">💼</div>
            <div>Wallet</div>
        </div>
    </div>

    <script>
        let score = localStorage.getItem('fzl_score') ? parseInt(localStorage.getItem('fzl_score')) : 0;
        let energy = 1000;
        const maxEnergy = 1000;

        document.getElementById('score').innerText = score.toLocaleString();

        function tapCoin(event) {
            if (energy > 0) {
                score++;
                energy--;
                updateUI();
                localStorage.setItem('fzl_score', score);
            }
        }

        function updateUI() {
            document.getElementById('score').innerText = score.toLocaleString();
            document.getElementById('energy-text').innerText = `${energy} / ${maxEnergy}`;
            document.getElementById('energy-fill').style.width = `${(energy / maxEnergy) * 100}%`;
        }

        // Energy Auto Recharge
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 2;
                if (energy > maxEnergy) energy = maxEnergy;
                updateUI();
            }
        }, 1000);
    </script>
</body>
    </html>
