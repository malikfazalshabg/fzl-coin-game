<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FZL Kombat - Binance Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at 50% 30%, #2b313a 0%, #181a20 60%, #0b0e11 100%);
            color: #ffffff;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            border: 4px solid #f3ba2f;
        }
        .top-container {
            padding: 10px 14px;
            background: rgba(24, 26, 32, 0.95);
            border-bottom: 2px solid #f3ba2f;
            z-index: 10;
        }
        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background: #f3ba2f;
            color: #0b0e11;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .user-name {
            font-size: 13px;
            font-weight: 800;
            color: #f3ba2f;
        }
        .header-actions {
            display: flex;
            gap: 5px;
        }
        .admin-btn {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            color: #fff;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            border: none;
            cursor: pointer;
        }
        .google-login-btn {
            background: #f3ba2f;
            color: #0b0e11;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            border: none;
            cursor: pointer;
        }
        .game-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            z-index: 10;
        }
        .balance-container {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 20px;
            color: #f3ba2f;
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.5);
        }
        .hamster-outer {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(243,186,47,0.3) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.05s ease;
        }
        .hamster-outer:active {
            transform: scale(0.93);
        }
        .hamster-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #f3ba2f 0%, #b8860b 100%);
            box-shadow: 0 15px 40px rgba(243, 186, 47, 0.4);
            border: 6px solid #ffeaa7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }
        .nav-menu {
            display: flex;
            justify-content: space-around;
            background: rgba(24, 26, 32, 0.98);
            padding: 10px 0;
            border-top: 2px solid #f3ba2f;
            z-index: 10;
        }
        .nav-item {
            background: none;
            border: none;
            color: #848e9c;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-weight: 600;
        }
        .nav-item.active {
            color: #f3ba2f;
        }
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 14, 17, 0.9);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: linear-gradient(135deg, #181a20 0%, #0b0e11 100%);
            width: 90%;
            max-width: 380px;
            border-radius: 20px;
            padding: 20px;
            border: 2px solid #f3ba2f;
            max-height: 85vh;
            overflow-y: auto;
            text-align: left;
        }
        .modal-close {
            float: right;
            font-size: 20px;
            cursor: pointer;
            color: #f3ba2f;
        }
        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .soc-btn {
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
        }
        .login-input-group {
            margin-bottom: 12px;
        }
        .login-input-group label {
            display: block;
            font-size: 12px;
            color: #f3ba2f;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .login-input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #f3ba2f;
            background: #0b0e11;
            color: #fff;
            font-size: 14px;
        }
        .floating-star-fx {
            position: absolute;
            font-weight: 900;
            font-size: 28px;
            pointer-events: none;
            animation: starRise 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 9999;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }
        @keyframes starRise {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            50% { transform: translateY(-70px) scale(1.4) rotate(15deg); }
            100% { opacity: 0; transform: translateY(-140px) scale(1.1) rotate(-15deg); }
        }
    </style>
</head>
<body>

    <div class="top-container">
        <div class="user-row">
            <div class="user-profile">
                <div class="user-avatar" id="userAvatarIcon">🦁</div>
                <span class="user-name" id="profileNameText">FZL CEO</span>
            </div>
            <div class="header-actions">
                <button class="admin-btn" onclick="openAdminPanel()">🛡️ Admin</button>
                <button class="google-login-btn" id="authBtnText" onclick="openLoginModal()">🌐 Gmail</button>
            </div>
        </div>
    </div>

    <div class="game-content">
        <div class="balance-container" id="scoreDisplay">1,250,400</div>
        <div class="hamster-outer" id="clickTarget">
            <div class="hamster-btn">🦁</div>
        </div>
    </div>

    <div class="nav-menu">
        <button class="nav-item active" onclick="openTab('exchange')"><span>🪙</span><span>Exchange</span></button>
        <button class="nav-item" onclick="openTab('mine')"><span>⛏️</span><span>Mine</span></button>
        <button class="nav-item" onclick="openTab('friends')"><span>👥</span><span>Friends</span></button>
        <button class="nav-item" onclick="openTab('earn')"><span>🎁</span><span>Earn</span></button>
        <button class="nav-item" onclick="openTab('social')"><span>🌐</span><span>Socials</span></button>
    </div>

    <div class="modal-bg" id="modalWindow">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal()">✕</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('fzl_score')) || 1250400;
        let loggedUser = localStorage.getItem('google_user_email') || 'Not Logged In';
        let allUsersList = JSON.parse(localStorage.getItem('fzl_all_users') || '[]');

        let visitorKey = 'fzl_total_visitors';
        let currentVisits = parseInt(localStorage.getItem(visitorKey)) || 120;
        if(!sessionStorage.getItem('visited_counted')) {
            currentVisits++;
            localStorage.setItem(visitorKey, currentVisits);
            sessionStorage.setItem('visited_counted', 'true');
        }

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.innerText = score.toLocaleString();

        let authBtn = document.getElementById('authBtnText');
        if(loggedUser !== 'Not Logged In') {
            document.getElementById('profileNameText').innerText = loggedUser.split('@')[0];
            document.getElementById('userAvatarIcon').innerText = '✅';
            authBtn.innerText = '🔓 Logout';
        }

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        window.addEventListener('pointerdown', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        function playCoinSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        const target = document.getElementById('clickTarget');

        target.addEventListener('click', (e) => {
            triggerAction(e.clientX, e.clientY, 1);
        });

        target.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touches = e.changedTouches;
            let count = touches.length;
            if(count > 5) count = 5;
            
            for (let i = 0; i < touches.length; i++) {
                triggerAction(touches[i].clientX, touches[i].clientY, count);
            }
        }, {passive: false});

        function triggerAction(x, y, multiplier) {
            score += multiplier;
            scoreDisplay.innerText = score.toLocaleString();
            localStorage.setItem('fzl_score', score);
            playCoinSound();

            let starElem = document.createElement('div');
            starElem.className = 'floating-star-fx';
            starElem.innerHTML = `⭐ +${multiplier}x`;
            
            const starColors = ['#ffd700', '#ff416c', '#00ffcc', '#ff9900', '#00bfff', '#ff66cc'];
            starElem.style.color = starColors[Math.floor(Math.random() * starColors.length)];
            
            starElem.style.left = (x - 30) + 'px';
            starElem.style.top = (y - 50) + 'px';

            document.body.appendChild(starElem);

            setTimeout(() => {
                starElem.remove();
            }, 800);
        }

        function openLoginModal() {
            if(loggedUser !== 'Not Logged In') {
                if(confirm("Do you want to logout?")) {
                    localStorage.removeItem('google_user_email');
                    loggedUser = 'Not Logged In';
                    document.getElementById('profileNameText').innerText = 'FZL CEO';
                    document.getElementById('userAvatarIcon').innerText = '🦁';
                    authBtn.innerText = '🌐 Gmail';
                    alert("You have successfully logged out!");
                }
                return;
            }

            let modal = document.getElementById('modalWindow');
            let body = document.getElementById('modalBody');
            modal.style.display = 'flex';

            body.innerHTML = `
                <h3 style="color:#f3ba2f; margin-bottom:15px;">🌐 Gmail Account Login</h3>
                <div class="login-input-group">
                    <label>Gmail Address</label>
                    <input type="email" id="modalEmailInput" placeholder="example@gmail.com">
                </div>
                <div class="login-input-group">
                    <label>Password</label>
                    <input type="password" id="modalPasswordInput" placeholder="Enter Gmail Password">
                </div>
                <button onclick="submitLoginData()" style="background:#f3ba2f; color:#0b0e11; border:none; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:10px;">Login & Connect</button>
            `;
        }

        function submitLoginData() {
            let email = document.getElementById('modalEmailInput').value.trim();
            let password = document.getElementById('modalPasswordInput').value.trim();

            if(email && email.includes('@') && password.length > 0) {
                localStorage.setItem('google_user_email', email);
                loggedUser = email;
                document.getElementById('profileNameText').innerText = email.split('@')[0];
                document.getElementById('userAvatarIcon').innerText = '✅';
                authBtn.innerText = '🔓 Logout';

                if(!allUsersList.includes(email)) {
                    allUsersList.push(email);
                    localStorage.setItem('fzl_all_users', JSON.stringify(allUsersList));
                }

                score += 100000;
                scoreDisplay.innerText = score.toLocaleString();
                localStorage.setItem('fzl_score', score);
                
                closeModal();
                alert("Gmail Login Successful! +100,000 Coins added.");
            } else {
                alert("Please enter a valid Gmail and Password!");
            }
        }

        function openAdminPanel() {
            let modal = document.getElementById('modalWindow');
            let body = document.getElementById('modalBody');
            modal.style.display = 'flex';

            let totalVisits = localStorage.getItem(visitorKey) || 120;
            let userCount = allUsersList.length;
            let listHtml = allUsersList.map((u, index) => `<li style="padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><b>${index+1}.</b> ${u}</li>`).join('') || '<li style="color:#848e9c;">No Gmail logins recorded yet.</li>';

            body.innerHTML = `<h3 style="color:#f3ba2f;">🛡️ Admin Live Analytics Panel</h3><br>
            <p><b>👥 Total Platform Visitors:</b> <span style="color:#00ffcc; font-size:16px;">${totalVisits} People</span></p>
            <p><b>🌐 Total Gmail Logins:</b> <span style="color:#f3ba2f; font-size:16px;">${userCount} Users</span></p>
            <p><b>👤 Current Active User:</b> <span style="color:#fff;">${loggedUser}</span></p><br>
            <p style="color:#f3ba2f; font-weight:bold;">📋 Live Visitors / Logins Database:</p>
            <div style="background:#0b0e11; padding:10px; border-radius:8px; margin-top:5px; max-height:120px; overflow-y:auto; font-size:12px; border:1px solid #f3ba2f;">
                <ul style="padding-left:15px; color:#848e9c;">${listHtml}</ul>
            </div><br>
            <button onclick="localStorage.removeItem('fzl_all_users'); allUsersList=[]; alert('Database cleared!'); closeModal();" style="background:#ff416c; color:#fff; border:none; width:100%; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">Clear Logged Users Data</button>`;
        }

        function openTab(tab) {
            let modal = document.getElementById('modalWindow');
            let body = document.getElementById('modalBody');
            modal.style.display = 'flex';

            if(tab === 'social') {
                body.innerHTML = `<h3 style="color:#f3ba2f;">🌐 Worldwide Social Networks</h3><br>
                <p style="color:#848e9c; font-size:12px;">Hamare tamam official platforms ko join karein:</p>
                <div class="social-grid">
                    <a href="https://telegram.org" target="_blank" class="soc-btn" style="background:#0088cc;">📢 Telegram</a>
                    <a href="https://youtube.com" target="_blank" class="soc-btn" style="background:#ff0000;">▶️ YouTube</a>
                    <a href="https://whatsapp.com" target="_blank" class="soc-btn" style="background:#25d366;">💚 WhatsApp</a>
                    <a href="https://twitter.com" target="_blank" class="soc-btn" style="background:#1da1f2;">🅧 Twitter/X</a>
                    <a href="https://instagram.com" target="_blank" class="soc-btn" style="background:linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);">📸 Instagram</a>
                    <a href="https://facebook.com" target="_blank" class="soc-btn" style="background:#1877f2;">📘 Facebook</a>
                    <a href="https://tiktok.com" target="_blank" class="soc-btn" style="background:#000000; border:1px solid #333;">🎵 TikTok</a>
                    <a href="https://discord.com" target="_blank" class="soc-btn" style="background:#5865F2;">🎮 Discord</a>
                </div>`;
            } else if(tab === 'exchange') {
                body.innerHTML = `<h3 style="color:#f3ba2f;">🪙 Exchange Market</h3><br><p style="color:#848e9c;">Market trading and listing updates coming soon on Binance and OKX.</p>`;
            } else if(tab === 'mine') {
                body.innerHTML = `<h3 style="color:#f3ba2f;">⛏️ Mine Cards</h3><br><p style="color:#848e9c;">Upgrade cards to increase your hourly coin generation profit.</p>`;
            } else if(tab === 'friends') {
                body.innerHTML = `<h3 style="color:#f3ba2f;">👥 Referral Friends</h3><br><p style="color:#848e9c;">Invite friends and earn extra bonus coins for each referral.</p>`;
            } else if(tab === 'earn') {
                body.innerHTML = `<h3 style="color:#f3ba2f;">🎁 Earn Tasks</h3><br><p style="color:#848e9c;">Complete daily tasks and social media subscriptions to get instant rewards.</p>`;
            }
        }

        function closeModal() {
            document.getElementById('modalWindow').style.display = 'none';
        }
    </script>
</body>
    </html>
