<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FZL Kombat - VIP Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            /* VIP Designer Gradient Background instead of plain black */
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f101d 50%, #06070a 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        /* VIP Top Header Card */
        .top-container {
            padding: 12px 14px;
            background: rgba(26, 29, 45, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #f3ba2f 0%, #e67e22 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 10px rgba(243, 186, 47, 0.5);
        }
        .user-name {
            font-size: 14px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }
        .exchange-pill {
            background: linear-gradient(135deg, #252b42 0%, #171b2c 100%);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            color: #f3ba2f;
            border: 1px solid rgba(243, 186, 47, 0.3);
            font-weight: 700;
        }
        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .metric-card {
            background: rgba(22, 26, 41, 0.8);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .metric-title {
            font-size: 9px;
            color: #94a3b8;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-value {
            font-size: 12px;
            font-weight: 800;
            color: #f3ba2f;
        }
        /* Main Game Area with Glow Effect */
        .game-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
        }
        .balance-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 25px;
            text-shadow: 0 0 25px rgba(243, 186, 47, 0.5);
            letter-spacing: 1px;
        }
        .balance-icon {
            font-size: 34px;
            filter: drop-shadow(0 0 8px rgba(243, 186, 47, 0.6));
        }
        .hamster-outer {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(243,186,47,0.25) 0%, rgba(79, 70, 229, 0.1) 50%, transparent 75%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.15);
        }
        .hamster-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #f3ba2f 0%, #b8860b 100%);
            box-shadow: 0 15px 40px rgba(184, 134, 11, 0.5), inset 0 6px 15px rgba(255,255,255,0.5);
            border: 6px solid #ffeaa7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 85px;
            transition: transform 0.06s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
        }
        .hamster-btn:active {
            transform: scale(0.9);
        }
        /* VIP Floating Star Tap Animation */
        .tap-star {
            position: absolute;
            font-weight: 900;
            color: #00ffcc;
            font-size: 26px;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.9);
            animation: starUp 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 999;
        }
        @keyframes starUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            100% { opacity: 0; transform: translate(-50%, -120px) scale(1.4); }
        }
        /* Footer Energy & Boost */
        .footer-info {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 0 18px 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .energy-status {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .boost-btn-original {
            background: linear-gradient(135deg, #252b42 0%, #1a1f33 100%);
            border: 1px solid rgba(243, 186, 47, 0.4);
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 800;
            color: #f3ba2f;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        /* Bottom VIP Navigation Menu */
        .nav-menu {
            display: flex;
            justify-content: space-around;
            background: rgba(18, 20, 32, 0.9);
            backdrop-filter: blur(15px);
            padding: 10px 0 14px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.6);
        }
        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: #f3ba2f;
            text-shadow: 0 0 10px rgba(243, 186, 47, 0.4);
        }
        .nav-item span:first-child {
            font-size: 20px;
        }
        /* VIP Modal Popup */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 6, 10, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: linear-gradient(135deg, #1c2035 0%, #121522 100%);
            width: 90%;
            max-width: 380px;
            border-radius: 20px;
            padding: 22px;
            border: 1px solid rgba(243, 186, 47, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
        }
        .modal-close {
            float: right;
            font-size: 20px;
            cursor: pointer;
            color: #94a3b8;
        }
        .modal-close:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- VIP Top Container -->
    <div class="top-container">
        <div class="user-row">
            <div class="user-profile">
                <div class="user-avatar">🦁</div>
                <span class="user-name">FZL VIP CEO</span>
            </div>
            <div class="exchange-pill">⚡ BINANCE VIP</div>
        </div>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Profit / hour</div>
                <div class="metric-value">+150.8K</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Daily cipher</div>
                <div class="metric-value" style="color:#00ffcc">• — • •</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Daily combo</div>
                <div class="metric-value">3 / 3</div>
            </div>
        </div>
    </div>

    <!-- Main Game Section -->
    <div class="game-content">
        <div class="balance-container">
            <span class="balance-icon">🪙</span>
            <span id="score">845,920</span>
        </div>
        <div class="hamster-outer" id="hamsterArea">
            <div class="hamster-btn" id="hamsterBtn">🦁</div>
        </div>
    </div>

    <!-- VIP Energy & Boost Footer -->
    <div class="footer-info">
        <div class="energy-status">
            ⚡ <span id="energy">750</span> / <span id="maxEnergy">1000</span>
        </div>
        <div class="boost-btn-original" onclick="openBoost()">
            🚀 Turbo Boost
        </div>
    </div>

    <!-- Bottom VIP Navigation Menu -->
    <div class="nav-menu">
        <button class="nav-item active" onclick="switchTab('exchange')">
            <span>🪙</span><span>Exchange</span>
        </button>
        <button class="nav-item" onclick="switchTab('mine')">
            <span>⛏️</span><span>Mine</span>
        </button>
        <button class="nav-item" onclick="switchTab('friends')">
            <span>👥</span><span>Friends</span>
        </button>
        <button class="nav-item" onclick="switchTab('earn')">
            <span>🎁</span><span>Earn</span>
        </button>
        <button class="nav-item" onclick="switchTab('airdrop')">
            <span>🪂</span><span>Airdrop</span>
        </button>
    </div>

    <!-- Modal Popup System -->
    <div class="modal-bg" id="modalWindow">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal()">✕</span>
            <div id="modalContentBody">Content</div>
        </div>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('hm_score')) || 845920;
        let energy = parseInt(localStorage.getItem('hm_energy')) || 750;
        let maxEnergy = 1000;
        let profitPerHour = 150800;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const hamsterBtn = document.getElementById('hamsterBtn');

        scoreEl.innerText = score.toLocaleString();
        energyEl.innerText = energy;

        // Premium Sound Generator
        let audioCtx = null;
        function playOriginalSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(950, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        // Tap Mechanics & VIP Star Glow Effect
        hamsterBtn.addEventListener('click', (e) => {
            if (energy >= 1) {
                score += 1;
                energy -= 1;
                scoreEl.innerText = score.toLocaleString();
                energyEl.innerText = energy;
                
                localStorage.setItem('hm_score', score);
                localStorage.setItem('hm_energy', energy);

                playOriginalSound();

                // Generate Floating VIP Star (+1 ⭐)
                let rect = hamsterBtn.getBoundingClientRect();
                let x = e.clientX ? e.clientX : (rect.left + rect.width / 2);
                let y = e.clientY ? e.clientY : (rect.top + rect.height / 2);

                let star = document.createElement('div');
                star.className = 'tap-star';
                star.innerHTML = "+1 ⭐";
                star.style.left = x + 'px';
                star.style.top = y + 'px';

                document.body.appendChild(star);
                setTimeout(() => star.remove(), 750);
            }
        });

        // Energy Recovery
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 15;
                if (energy > maxEnergy) energy = maxEnergy;
                energyEl.innerText = energy;
            }
        }, 1000);

        function openBoost() {
            let modal = document.getElementById('modalWindow');
            let body = document.getElementById('modalContentBody');
            modal.style.display = 'flex';
            body.innerHTML = `<h3>🚀 VIP Turbo Boost</h3><br>
            <p>Refill your energy instantly to maximum capacity for continuous tapping.</p><br>
            <button onclick="energy=maxEnergy; energyEl.innerText=energy; closeModal(); alert('Energy Fully Refilled!');" style="background:linear-gradient(135deg, #f3ba2f 0%, #e67e22 100%); color:#000; border:none; width:100%; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer; box-shadow: 0 4px 15px rgba(243,186,47,0.4);">Refill Energy (Free)</button>`;
        }

        function closeModal() {
            document.getElementById('modalWindow').style.display = 'none';
        }

        function switchTab(tab) {
            let modal = document.getElementById('modalWindow');
            let body = document.getElementById('modalContentBody');
            modal.style.display = 'flex';

            if (tab === 'mine') {
                body.innerHTML = `<h3>⛏️ VIP Mine Market</h3><br>
                <p><b>Quantum Server:</b> +25,000 PPH (Cost: 100,000 🪙)</p><br>
                <button onclick="if(score>=100000){score-=100000; profitPerHour+=25000; scoreEl.innerText=score.toLocaleString(); alert('VIP Card Upgraded!'); closeModal();}else{alert('Not enough coins!');}" style="background:linear-gradient(135deg, #f3ba2f 0%, #e67e22 100%); color:#000; border:none; width:100%; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">Upgrade Card</button>`;
            } else if (tab === 'friends') {
                body.innerHTML = `<h3>👥 VIP Referral Program</h3><br>
                <p>Invite friends and earn 25,000 FZL coins bonus for each referral.</p><br>
                <input type="text" value="https://t.me/FZLKombatBot?start=vip_ref_2027" style="width:100%; padding:10px; background:#0f101d; color:#fff; border:1px solid rgba(243,186,47,0.3); border-radius:8px;" readonly>`;
            } else if (tab === 'earn') {
                body.innerHTML = `<h3>🎁 VIP Daily Rewards</h3><br>
                <p>👉 Watch Official FZL Launch Stream (+200,000 🪙)</p><br>
                <button onclick="score+=200000; scoreEl.innerText=score.toLocaleString(); closeModal(); alert('VIP Reward Claimed!');" style="background:linear-gradient(135deg, #f3ba2f 0%, #e67e22 100%); color:#000; border:none; width:100%; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">Claim Reward</button>`;
            } else if (tab === 'airdrop') {
                body.innerHTML = `<h3>🪂 Binance Airdrop 2027</h3><br>
                <p>Connect your secure TON Wallet to verify eligibility for the upcoming token generation event.</p><br>
                <button onclick="alert('TON Wallet successfully linked to blockchain!'); closeModal();" style="background:#0088cc; color:#fff; border:none; width:100%; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">Connect TON Wallet</button>`;
            } else {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
                    </html>
