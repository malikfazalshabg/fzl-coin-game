<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FZL Kombat - Ultimate Social & Google Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f101d 50%, #06070a 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        /* Top Header Card */
        .top-container {
            padding: 10px 14px;
            background: rgba(26, 29, 45, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .user-avatar {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #f3ba2f 0%, #e67e22 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 10px rgba(243, 186, 47, 0.5);
        }
        .user-name {
            font-size: 13px;
            font-weight: 800;
            color: #ffd700;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .google-login-btn {
            background: #ffffff;
            color: #000;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(255,255,255,0.2);
        }
        .exchange-pill {
            background: linear-gradient(135deg, #252b42 0%, #171b2c 100%);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: #f3ba2f;
            border: 1px solid rgba(243, 186, 47, 0.3);
            font-weight: 700;
        }
        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .metric-card {
            background: rgba(22, 26, 41, 0.8);
            border-radius: 8px;
            padding: 6px 4px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .metric-title {
            font-size: 8px;
            color: #94a3b8;
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        .metric-value {
            font-size: 11px;
            font-weight: 800;
            color: #f3ba2f;
        }
        /* Main Game Area */
        .game-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            position: relative;
        }
        .balance-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 0 25px rgba(243, 186, 47, 0.5);
        }
        .balance-icon {
            font-size: 32px;
            filter: drop-shadow(0 0 8px rgba(243, 186, 47, 0.6));
        }
        .hamster-outer {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(243,186,47,0.25) 0%, rgba(79, 70, 229, 0.1) 50%, transparent 75%);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.15);
        }
        .hamster-btn {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: radial-gradient(circle, #f3ba2f 0%, #b8860b 100%);
            box-shadow: 0 15px 40px rgba(184, 134, 11, 0.5), inset 0 6px 15px rgba(255,255,255,0.5);
            border: 6px solid #ffeaa7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            transition: transform 0.06s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .hamster-btn:active {
            transform: scale(0.9);
        }
        /* Floating Star Tap Animation */
        .tap-star {
            position: absolute;
            font-weight: 900;
            color: #00ffcc;
            font-size: 24px;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.9);
            animation: starUp 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            z-index: 999;
        }
        @keyframes starUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            100% { opacity: 0; transform: translate(-50%, -120px) scale(1.4); }
        }
        /* Footer Energy & Boost */
        .footer-info {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 0 18px 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .energy-status {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .boost-btn-original {
            background: linear-gradient(135deg, #252b42 0%, #1a1f33 100%);
            border: 1px solid rgba(243, 186, 47, 0.4);
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            color: #f3ba2f;
            cursor: pointer;
        }
        /* Bottom Navigation Menu */
        .nav-menu {
            display: flex;
            justify-content: space-around;
            background: rgba(18, 20, 32, 0.95);
            backdrop-filter: blur(15px);
            padding: 8px 0 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.6);
        }
        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
        }
        .nav-item.active {
            color: #f3ba2f;
            text-shadow: 0 0 10px rgba(243, 186, 47, 0.4);
        }
        .nav-item span:first-child {
            font-size: 18px;
        }
        /* Modal Popup System */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 6, 10, 0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: linear-gradient(135deg, #1c2035 0%, #121522 100%);
            width: 90%;
            max-width: 380px;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(243, 186, 47, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            max-height: 82vh;
            overflow-y: auto;
            text-align: left;
        }
        .modal-close {
            float: right;
            font-size: 18px;
            cursor: pointer;
            color: #94a3b8;
        }
        .social-btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .soc-btn {
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Top Container -->
    <div class="top-container">
        <div class="user-row">
            <div class="user-profile" onclick="openSocialHub()">
                <div class="user-avatar" id="userAvatarIcon">🦁</div>
                <span class="user-name" id="profileNameText">FZL VIP CEO</span>
            </div>
            <div class="header-actions">
                <button class="google-login-btn" onclick="triggerGoogleLogin()">
                    <span style="font-size:13px;">🌐</span> Google Login
                </button>
                <div class="exchange-pill">⚡ BINANCE</div>
            </div>
        </div>
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Profit / hour</div>
                <div class="metric-value">+150.8K</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Daily cipher</div>
                <div class="metric-value" style="color:#00ffcc">• — • •</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Daily combo</div>
                <div class="metric-value">3 / 3</div>
            </div>
        </div>
    </div>

    <!-- Main Game Section -->
    <div class="game-content">
        <div class="balance-container">
            <span class="balance-icon">🪙</span>
            <span id="score">846,260</span>
        </div>
        <div class="hamster-outer" id="hamsterArea">
            <div class="hamster-btn" id="hamsterBtn">🦁</div>
        </div>
    </div>

    <!-- Energy & Boost Footer -->
    <div class="footer-info">
        <div class="energy-status">
            ⚡ <span id="energy">800</span> / <span id="maxEnergy">1000</span>
        </div>
        <div class="boost-btn-original" onclick="openBoost()">
            🚀 Turbo Boost
        </div>
    </div>

    <!-- Bottom Navigation Menu -->
    <div class="nav-menu">
        <button class="nav-item active" onclick="switchTab('exchange')">
            <span>🪙</span><span>Exchange</span>
        </button>
        <button class="nav-item" onclick="switchTab('mine')">
            <span>⛏️</span><span>Mine</span>
        </button>
        <button class="nav-item" onclick="switchTab('friends')">
            <span>👥</span><span>Friends</span>
        </button>
        <button class="nav-item" onclick="switchTab('earn')">
            <span>🎁</span><span>Earn</span>
        </button>
        <button class="nav-item" onclick="switchTab('airdrop')">
            <span>🪂</span><span>Social & Airdrop</span>
        </button>
    </div>

    <!-- Modal Popup System -->
    <div class="modal-bg" id="modalWindow">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal()">✕</span>
            <div id="modalContentBody">Content</div>
        </div>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('hm_score')) || 846260;
        let energy = parseInt(localStorage.getItem('hm_energy')) || 800;
        let maxEnergy = 1000;
        let loggedUser = localStorage.getItem('google_user_email') || null;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const hamsterBtn = document.getElementById('hamsterBtn');

        scoreEl.innerText = score.toLocaleString();
        energyEl.innerText = energy;

        if(loggedUser) {
            document.getElementById('profileNameText').innerText = loggedUser.split('@')[0];
            document.getElementById('userAvatarIcon').innerText = '✅';
        }

        // Sound Generator
        let audioCtx = null;
        function playOriginalSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(950, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.1);

                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        // Tap Mechanics
        hamsterBtn.addEventListener('click', (e) => {
            if (energy >= 1) {
                score += 1;
                energy -= 1;
                scoreEl.innerText = score.toLocaleString();
                energyEl.innerText = energy;
                
                localStorage.setItem('hm_score', score);
                localStorage.setItem('hm_energy', energy);

                playOriginalSound();

                let rect = hamsterBtn.getBoundingClientRect();
                let x = e.clientX ? e.clientX : (rect.left + rect.width / 2);
                let y = e.clientY ? e.clientY : (rect.top + rect.height / 2);

                let star = document.createElement('div');
                star.className = 'tap-star';
                star.innerHTML = "+1 ⭐";
                star.style.left = x + 'px';
                star.style.top = y + 'px';

                document.body.appendChild(star);
                setTimeout(() => star.remove(), 750);
            }
        });

        // Energy Recovery
        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 15;
                if (energy > maxEnergy) energy = maxEnergy;
                energyEl.innerText = energy;
            }
        }, 1000);

        function triggerGoogleLogin() {
            let email = prompt("Google account se login karne ke liye apna Gmail darj karein (e.g., user@gmail.com):");
            if(email && email.includes('@')) {
                localStorage.setItem('google_user_email', email);
                document.getElementById('profileNameText').innerText = email.split('@')[0];
                document.getElementById('userAvatarIcon').innerText = '✅';
                score += 50000; // Bonus on Google Login
                scoreEl.innerText = score.toLocaleString();
                alert("Google Login Successful! +50,000 FZL Coins bonus added to your account via Google Search network.");
            } else if(email) {
                alert("Brah-raast sahi Gmail enter karein!");
            }
        }

        function openBoost() {
            let modal = document.getElementById('modalWindow');
            let body = document.getElementById('modalContentBody');
            modal.style.display = 'flex';
            body.innerHTML = `<h3>🚀 Turbo Boost</h3><br>
            <p>Refill your energy instantly to maximum capacity.</p><br>
            <button onclick="energy=maxEnergy; energyEl.innerText=energy; closeModal(); alert('Energy Fully Refilled!');" style="background:linear-gradient(135deg, #f3ba2f 0%, #e67e22 100%); color:#000; border:none; width:100%; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">Refill Energy (Free)</button>`;
        }

        function closeModal() {
            document.getElementById('modalWindow').style.display = 'none';
        }

        function openSocialHub() {
            switchTab('airdrop');
        }

        function switchTab(tab) {
            let modal = document.getElementById('modalWindow');
            let body = document.getElementById('modalContentBody');
            modal.style.display = 'flex';

            if (tab === 'mine') {
                body.innerHTML = `<h3>⛏️ Mine Upgrades</h3><br>
                <p><b>Binance Liquid Pool:</b> +30,000 PPH (Cost: 100,000 🪙)</p><br>
                <button onclick="if(score>=100000){score-=100000; scoreEl.innerText=score.toLocaleString(); alert('Upgraded!'); closeModal();}else{alert('Not enough coins!');}" style="background:#f3ba2f; border:none; width:100%; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">Upgrade Card</button>`;
            } else if (tab === 'friends') {
                body.innerHTML = `<h3>👥 Invite Friends</h3><br>
                <p>Share referral link across social media and earn crypto rewards.</p><br>
                <input type="text" value="https://t.me/FZLKombatBot?start=ref_social" style="width:100%; padding:8px; background:#0f101d; color:#fff; border:1px solid #323a52; border-radius:6px;" readonly>`;
            } else if (tab === 'earn') {
                body.innerHTML = `<h3>🎁 Social Media Tasks</h3><br>
                <p>👉 Subscribe YouTube Channel (+100k Coins)</p><br>
                <button onclick="score+=100000; scoreEl.innerText=score.toLocaleString(); closeModal(); alert('Reward Claimed!');" style="background:#f3ba2f; border:none; width:100%; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer;">Claim Task</button>`;
            } else if (tab === 'airdrop') {
                body.innerHTML = `<h3>🌐 Global Social & Binance Hub</h3><br>
                <p>Connect with all official networks & Binance ecosystem:</p>
                <div class="social-btn-grid">
                    <button class="soc-btn" style="background:#0088cc;" onclick="window.open('https://telegram.org','_blank')">📢 Telegram</button>
                    <button class="soc-btn" style="background:#ff0000;" onclick="window.open('https://youtube.com','_blank')">▶️ YouTube</button>
                    <button class="soc-btn" style="background:#25d366;" onclick="window.open('https://whatsapp.com','_blank')">💚 WhatsApp</button>
                    <button class="soc-btn" style="background:#1da1f2;" onclick="window.open('https://twitter.com','_blank')">🅧 Twitter/X</button>
                    <button class="soc-btn" style="background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);" onclick="window.open('https://instagram.com','_blank')">📸 Instagram</button>
                    <button class="soc-btn" style="background:#f3ba2f; color:#000;" onclick="window.open('https://binance.com','_blank')">🟡 Binance Wallet</button>
                </div>`;
            } else {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
        </html>
