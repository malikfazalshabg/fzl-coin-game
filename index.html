<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Mining & Referral App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
        }
        header {
            background: #0f172a;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            font-size: 1.2rem;
            color: #38bdf8;
        }
        .admin-btn, .gmail-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .admin-btn:hover, .gmail-btn:hover {
            background: #2563eb;
        }
        .content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }
        .card h3 {
            margin-bottom: 10px;
            color: #cbd5e1;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .nav-tabs {
            display: flex;
            background: #0f172a;
            border-top: 1px solid #334155;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #94a3b8;
            padding: 15px 0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
            text-align: center;
        }
        .tab-btn.active {
            color: #38bdf8;
            background: #1e293b;
            border-top: 2px solid #38bdf8;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .action-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #059669;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid #334155;
        }
        .modal-content input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }
        .close-modal {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Mining & Rewards</h1>
            <div style="display: flex; gap: 8px;">
                <button class="gmail-btn" onclick="openGmailModal()">📧 Gmail</button>
                <button class="admin-btn" onclick="openAdminModal()">🔒 Admin</button>
            </div>
        </header>

        <div class="content">
            <!-- Tab 1: Home / Mining -->
            <div id="tab-home" class="tab-content active">
                <div class="card">
                    <h3>Your Balance</h3>
                    <div class="stat-value" id="balance">0.00 COIN</div>
                </div>
                <button class="action-btn" onclick="startMining()">Start Mining</button>
            </div>

            <!-- Tab 2: Friends (Referral) -->
            <div id="tab-friends" class="tab-content">
                <div class="card">
                    <h3>Friends Invited</h3>
                    <div class="stat-value" id="friend-count">0</div>
                </div>
                <button class="action-btn" onclick="shareRefLink()">Share Invite Link</button>
            </div>

            <!-- Tab 3: Mine Cards -->
            <div id="tab-mine" class="tab-content">
                <div class="card">
                    <h3>Active Mining Cards</h3>
                    <p style="color: #94a3b8; margin-top: 5px;">Boost your speed with unlocked cards.</p>
                </div>
            </div>

            <!-- Tab 4: Exchange -->
            <div id="tab-exchange" class="tab-content">
                <div class="card">
                    <h3>Exchange Market</h3>
                    <p style="color: #94a3b8; margin-top: 5px;">Trade your coins securely here.</p>
                </div>
            </div>
        </div>

        <!-- Navigation Bar (Open for Everyone) -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('home', this)">🏠 Home</button>
            <button class="tab-btn" onclick="switchTab('friends', this)">👥 Friends</button>
            <button class="tab-btn" onclick="switchTab('mine', this)">⛏️ Mine</button>
            <button class="tab-btn" onclick="switchTab('exchange', this)">🏛️ Exchange</button>
        </div>
    </div>

    <!-- Admin Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3>Admin Panel Login</h3>
            <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password">
            <button class="action-btn" onclick="verifyAdmin()">Login</button>
            <button class="close-modal" onclick="closeModals()">Cancel</button>
        </div>
    </div>

    <!-- Gmail Verification Modal -->
    <div id="gmailModal" class="modal">
        <div class="modal-content">
            <h3>Gmail Verification</h3>
            <input type="email" id="userEmailInput" placeholder="Enter your Gmail">
            <button class="action-btn" onclick="sendGmailCode()">Send Code</button>
            <input type="text" id="userCodeInput" placeholder="Enter 6-digit Code" style="display:none;">
            <button id="verifyCodeBtn" class="action-btn" style="display:none;" onclick="verifyGmailCode()">Verify Code</button>
            <button class="close-modal" onclick="closeModals()">Close</button>
        </div>
    </div>

    <script>
        // Tab Switching Logic
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
        }

        // Modals Control
        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function openGmailModal() {
            document.getElementById('gmailModal').style.display = 'flex';
        }

        function closeModals() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('gmailModal').style.display = 'none';
        }

        // Admin Security Logic
        function verifyAdmin() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === 'malik786') {
                alert('Welcome to Admin Panel, Boss!');
                closeModals();
                // Admin features can be unlocked here
            } else {
                alert('Wrong Password! Access Denied.');
            }
        }

        // Gmail Verification Simulation Logic
        let sentCode = '';
        function sendGmailCode() {
            const email = document.getElementById('userEmailInput').value;
            if(!email) {
                alert('Please enter a valid email.');
                return;
            }
            sentCode = Math.floor(100000 + Math.random() * 900000).toString();
            alert('Verification code sent to ' + email + '\n(For testing, your code is: ' + sentCode + ')');
            document.getElementById('userCodeInput').style.display = 'block';
            document.getElementById('verifyCodeBtn').style.display = 'block';
        }

        function verifyGmailCode() {
            const enteredCode = document.getElementById('userCodeInput').value;
            if (enteredCode === sentCode) {
                alert('Gmail Verified Successfully!');
                closeModals();
            } else {
                alert('Invalid Code! No bypass allowed. Try again.');
            }
        }

        function startMining() {
            alert('Mining started successfully!');
        }

        function shareRefLink() {
            alert('Invite link copied to clipboard!');
        }
    </script>
</body>
                </html>
