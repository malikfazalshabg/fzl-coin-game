<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FZL Coin Bot</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background: #0f172a; color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            justify-content: space-between;
            height: 100vh; overflow: hidden;
        }
        .header {
            background: #1e293b; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #3b82f6; font-size: 13px; font-weight: bold;
        }
        .badge { background: #2563eb; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        .content {
            flex: 1; display: none; flex-direction: column;
            align-items: center; justify-content: flex-start; padding: 15px; text-align: center;
            overflow-y: auto;
        }
        .content.active { display: flex; }
        .score-box { font-size: 38px; color: #38bdf8; font-weight: bold; margin: 15px 0; }
        .tiger-btn {
            width: 160px; height: 160px; background: #f59e0b;
            border: 6px solid #fbbf24; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; cursor: pointer; margin: 20px 0;
            box-shadow: 0 0 30px rgba(251,191,36,0.5);
        }
        .tiger-btn:active { transform: scale(0.95); }
        .nav {
            display: flex; justify-content: space-around;
            background: #1e293b; padding: 10px 0; border-top: 2px solid #3b82f6;
        }
        .nav-b { background: none; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; font-weight: bold; }
        .nav-b.active { color: #38bdf8; }
        .action-box { background: #1e293b; border: 1px solid #3b82f6; padding: 15px; border-radius: 10px; width: 100%; max-width: 350px; margin-top: 10px; text-align: left; }
        .btn-main { background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">Malak (Lvl <span id="lvl">1</span>)</div>
        <div class="badge" onclick="navTo('social')">Socials</div>
    </div>

    <!-- Home Tab -->
    <div id="p-home" class="content active">
        <div style="font-size: 12px; color: #93c5fd; margin-bottom: 10px;">Elite Rank > Level <span id="curLvlText">1</span></div>
        
        <div class="score-box">🪙 <span id="score">0</span></div>

        <div class="tiger-btn" id="tigerBtn">🐅</div>

        <div style="font-size: 12px; color: #93c5fd; margin-top: 10px;">
            ⚡ Energy: <span id="energy">1500</span> / 1500
        </div>
    </div>

    <!-- Levels Tab -->
    <div id="p-levels" class="content">
        <div class="action-box">
            <h3>Elite Rank Upgrade</h3>
            <p style="font-size: 12px;">Required: <span id="uiLevelCost">200,000 Coins</span></p>
            <button class="btn-main" onclick="upgradeLevel()">Upgrade Level</button>
        </div>
    </div>

    <!-- Friends Tab -->
    <div id="p-friends" class="content">
        <div class="action-box">
            <h3>Friends Invite</h3>
            <p style="font-size: 12px;">Earn 25,000 coins per invite!</p>
            <button class="btn-main" onclick="alert('Invite link copied!')">Share Link</button>
        </div>
    </div>

    <!-- Socials Tab -->
    <div id="p-social" class="content">
        <div class="action-box">
            <h3>Community</h3>
            <button class="btn-main" onclick="window.open('https://t.me', '_blank')">Join Telegram</button>
        </div>
    </div>

    <!-- Admin Tab -->
    <div id="p-admin" class="content">
        <div class="action-box">
            <h3>Admin Panel</h3>
            <input type="password" id="pin" placeholder="PIN (786)" style="width:100%; padding:8px; background:#0f172a; color:#fff; border:1px solid #3b82f6; border-radius:5px; margin-bottom:8px;">
            <button class="btn-main" onclick="adminLogin()">Login</button>
            <div id="adminPanelBody" style="display:none; margin-top:10px;">
                <button class="btn-main" style="background:#16a34a;" onclick="addBonus()">Add 1,000,000 Coins</button>
            </div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav">
        <button class="nav-b active" id="nb-home" onclick="navTo('home')">Home</button>
        <button class="nav-b" id="nb-levels" onclick="navTo('levels')">Levels</button>
        <button class="nav-b" id="nb-friends" onclick="navTo('friends')">Friends</button>
        <button class="nav-b" id="nb-social" onclick="navTo('social')">Socials</button>
        <button class="nav-b" id="nb-admin" onclick="navTo('admin')">Admin</button>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('fzl_score')) || 0;
        let energy = parseInt(localStorage.getItem('fzl_energy')) || 1500;
        let level = parseInt(localStorage.getItem('fzl_level')) || 1;

        function saveData() {
            localStorage.setItem('fzl_score', score);
            localStorage.setItem('fzl_energy', energy);
            localStorage.setItem('fzl_level', level);
        }

        function navTo(page) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-b').forEach(b => b.classList.remove('active'));
            document.getElementById('p-' + page).classList.add('active');
            document.getElementById('nb-' + page).classList.add('active');
        }

        document.getElementById('tigerBtn').addEventListener('click', () => {
            if (energy > 0) {
                score += 1;
                energy -= 1;
                updateUI();
                saveData();
            }
        });

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('energy').innerText = energy;
            document.getElementById('lvl').innerText = level;
            document.getElementById('curLvlText').innerText = level;
        }

        setInterval(() => {
            if (energy < 1500) {
                energy += 10;
                if (energy > 1500) energy = 1500;
                updateUI();
                saveData();
            }
        }, 1000);

        function upgradeLevel() {
            let cost = level * 200000;
            if (score >= cost) {
                score -= cost;
                level += 1;
                updateUI();
                saveData();
                alert('Level upgraded to ' + level);
            } else {
                alert('Not enough coins!');
            }
        }

        function adminLogin() {
            if (document.getElementById('pin').value === '786') {
                document.getElementById('adminPanelBody').style.display = 'block';
                alert('Unlocked!');
            } else {
                alert('Wrong PIN!');
            }
        }

        function addBonus() {
            score += 1000000;
            updateUI();
            saveData();
            alert('Bonus added!');
        }

        updateUI();
    </script>
</body>
</html>
