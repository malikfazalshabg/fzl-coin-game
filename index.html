<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FZL Kombat - Sound FX & Binance Ready</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(180deg, #090a0f 0%, #12141c 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .header {
            padding: 12px 10px 4px 10px;
        }
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1d29;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #2d3250;
        }
        .username {
            font-size: 13px;
            font-weight: 700;
            color: #ffd700;
        }
        .actions-box {
            display: flex;
            gap: 5px;
        }
        .login-btn, .admin-btn, .vip-btn, .ton-btn {
            background: #f3ba2f;
            color: #090a0f;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }
        .ton-btn {
            background: #0088cc;
            color: #fff;
        }
        .admin-btn {
            background: #e91e63;
            color: #fff;
        }
        .stats-row {
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background: #151821;
            margin-top: 6px;
            border-radius: 8px;
        }
        .stat-box {
            text-align: center;
        }
        .stat-title {
            font-size: 9px;
            color: #848a9c;
        }
        .stat-value {
            font-size: 12px;
            font-weight: 700;
            color: #f3ba2f;
        }
        .game-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .score-display {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(243, 186, 47, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .coin-icon {
            width: 36px;
            height: 36px;
            background: #f3ba2f;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .coin-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .coin-btn {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: radial-gradient(circle, #f3ba2f 0%, #b8860b 100%);
            box-shadow: 0 0 40px rgba(243, 186, 47, 0.5);
            border: 6px solid #ffeaa7;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 75px;
            transition: transform 0.1s ease;
        }
        .coin-btn:active {
            transform: scale(0.94);
        }
        .footer-stats {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 8px 20px;
        }
        .energy-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
        }
        .boost-box {
            background: #272b3f;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #3d4468;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #141622;
            padding: 8px 0;
            border-top: 1px solid #222639;
        }
        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            color: #848a9c;
            cursor: pointer;
            background: none;
            border: none;
        }
        .nav-tab.active {
            color: #f3ba2f;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1c1f2e;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #3d4468;
            text-align: left;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close-modal {
            float: right;
            font-size: 20px;
            cursor: pointer;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <span class="username" id="playerName">👑 FZL CEO</span>
            <div class="actions-box">
                <button class="ton-btn" id="tonWalletBtn" onclick="connectTonWallet()">TON Wallet</button>
                <button class="vip-btn" onclick="claimDaily()">🎁 Daily</button>
                <button class="admin-btn" onclick="openAdminPanel()">Admin</button>
            </div>
        </div>
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-title">EARN / TAP</div>
                <div class="stat-value">+1 FZL</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">AIRDROP 2027</div>
                <div class="stat-value" style="color:#00ffcc">READY</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">PLAYERS</div>
                <div class="stat-value" id="activeCount">125,400</div>
            </div>
        </div>
    </div>

    <div class="game-main">
        <div class="score-display">
            <div class="coin-icon">🪙</div>
            <span id="score">0</span>
        </div>
        <div class="coin-wrapper">
            <div class="coin-btn" id="coinBtn">🦁</div>
        </div>
    </div>

    <div class="footer-stats">
        <div class="energy-box">
            ⚡ <span id="energy">1000</span> / 1000
        </div>
        <div class="boost-box" onclick="boostEnergy()">
            🚀 Turbo Boost
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-tab active" onclick="switchTab('exchange')"><span>🪙</span>Exchange</button>
        <button class="nav-tab" onclick="switchTab('mine')"><span>⛏️</span>Mine</button>
        <button class="nav-tab" onclick="switchTab('friends')"><span>👥</span>Friends</button>
        <button class="nav-tab" onclick="switchTab('earn')"><span>🎁</span>Earn</button>
        <button class="nav-tab" onclick="switchTab('leaderboard')"><span>🏆</span>Leaders</button>
    </div>

    <!-- Universal Modal -->
    <div class="modal" id="viModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalBody">Loading...</div>
        </div>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('fzl_score')) || 500;
        let energy = 1000;
        let maxEnergy = 1000;
        let isWalletConnected = false;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const coinBtn = document.getElementById('coinBtn');

        scoreEl.innerText = score.toLocaleString();

        // Real Coin Clink Sound Synthesizer
        function playCoinSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                // High pitch coin clink frequency
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.08);
                
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {
                // Audio context fallback if blocked by browser policy
            }
        }

        coinBtn.addEventListener('click', (e) => {
            if (energy > 0) {
                score += 1;
                energy -= 1;
                scoreEl.innerText = score.toLocaleString();
                energyEl.innerText = energy;
                localStorage.setItem('fzl_score', score);
                
                // Play coin drop/clink sound
                playCoinSound();

                let floatText = document.createElement('div');
                floatText.innerText = "+1";
                floatText.style.position = 'absolute';
                floatText.style.left = (e.clientX - 15) + 'px';
                floatText.style.top = (e.clientY - 30) + 'px';
                floatText.style.color = '#f3ba2f';
                floatText.style.fontSize = '22px';
                floatText.style.fontWeight = 'bold';
                floatText.style.pointerEvents = 'none';
                floatText.style.transition = 'all 0.6s ease';
                document.body.appendChild(floatText);

                setTimeout(() => {
                    floatText.style.transform = 'translateY(-50px)';
                    floatText.style.opacity = '0';
                }, 20);
                setTimeout(() => floatText.remove(), 600);
            }
        });

        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 3;
                if (energy > maxEnergy) energy = maxEnergy;
                energyEl.innerText = energy;
            }
        }, 1000);

        function boostEnergy() {
            energy = maxEnergy;
            energyEl.innerText = energy;
            alert("🚀 Turbo Boost Activated! Energy fully restored.");
        }

        function connectTonWallet() {
            if (!isWalletConnected) {
                let walletAddress = prompt("Enter your TON Wallet Address (e.g. UQD... or TonKeeper):");
                if (walletAddress && walletAddress.length > 5) {
                    isWalletConnected = true;
                    document.getElementById('tonWalletBtn').innerText = "Connected ✅";
                    document.getElementById('tonWalletBtn').style.background = "#00ffcc";
                    document.getElementById('tonWalletBtn').style.color = "#000";
                    alert("🎉 TON Wallet Connected Successfully for Binance Airdrop 2027!");
                } else {
                    alert("❌ Invalid Wallet Address!");
                }
            } else {
                alert("✅ Wallet is already linked and verified on blockchain!");
            }
        }

        function claimDaily() {
            score += 5000;
            scoreEl.innerText = score.toLocaleString();
            localStorage.setItem('fzl_score', score);
            alert("🎁 Daily Airdrop Bonus Claimed: +5,000 FZL Coins added!");
        }

        function openAdminPanel() {
            let pwd = prompt("Enter VIP Admin Password:");
            if (pwd === "malik786") {
                let modal = document.getElementById('viModal');
                let body = document.getElementById('modalBody');
                modal.style.display = 'flex';
                body.innerHTML = `<h3>👑 FZL Binance 2027 Admin Control</h3><br>
                <p><b>Status:</b> Live & Secured</p><br>
                <p><b>Total Global Players:</b> 125,400</p><br>
                <p><b>Linked TON Wallets:</b> 84,210</p><br>
                <p><b>Total Minted FZL:</b> ${(score * 250).toLocaleString()}</p><br>
                <p style="color:#00ffcc"><b>Admin Owner:</b> Malik (Granted)</p>`;
            } else if (pwd !== null) {
                alert("❌ Incorrect Admin Password!");
            }
        }

        function closeModal() {
            document.getElementById('viModal').style.display = 'none';
        }

        function switchTab(tab) {
            let modal = document.getElementById('viModal');
            let body = document.getElementById('modalBody');
            
            if (tab === 'friends') {
                modal.style.display = 'flex';
                body.innerHTML = `<h3>👥 Invite & Earn 2027</h3><br>
                <p>Share your official Telegram Bot referral link. Get <b>10,000 FZL Coins</b> per referral for Binance listing snapshot!</p><br>
                <input type="text" value="https://t.me/FZLKombatBot?start=ref_malik2027" style="width:100%; padding:10px; background:#12141c; color:#fff; border:1px solid #3d4468; border-radius:8px;" readonly><br><br>
                <button onclick="alert('Telegram Bot referral link copied!')" style="background:#f3ba2f; border:none; padding:10px; width:100%; border-radius:8px; font-weight:bold; cursor:pointer;">Copy Referral Link</button>`;
            } else if (tab === 'leaderboard') {
                modal.style.display = 'flex';
                body.innerHTML = `<h3>🏆 Global 2027 Leaderboard</h3><br>
                <ol style="padding-left: 20px; line-height: 2;">
                    <li><b>BinanceWhale</b> - 1,450,000,000 🪙</li>
                    <li><b>Malik_Founder</b> - 1,120,000,000 🪙</li>
                    <li><b>TonMaster</b> - 890,500,000 🪙</li>
                    <li><b>CryptoNinja</b> - 650,000,000 🪙</li>
                    <li><b>You (CEO)</b> - ${score.toLocaleString()} 🪙</li>
                </ol>`;
            } else if (tab === 'earn') {
                modal.style.display = 'flex';
                body.innerHTML = `<h3>🎁 Binance Listing Tasks</h3><br>
                <p>👉 Join Official Telegram Community (+25,000 FZL)</p><br>
                <p>👉 Follow FZL Kombat on X / Twitter (+25,000 FZL)</p><br>
                <button onclick="alert('Tasks verified!'); score+=25000; scoreEl.innerText=score.toLocaleString(); closeModal();" style="background:#f3ba2f; border:none; padding:10px; width:100%; border-radius:8px; font-weight:bold; cursor:pointer;">Claim Task Reward</button>`;
            } else {
                alert("Navigating to " + tab.toUpperCase() + "...");
            }
        }
    </script>
</body>
    </html>
