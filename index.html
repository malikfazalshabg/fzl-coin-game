<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FZL Coin - Working Direct Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            justify-content: space-between;
            height: 100vh; overflow: hidden;
        }
        .header {
            background: #121620; padding: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #1f293d; font-weight: bold;
        }
        .content {
            flex: 1; display: none; flex-direction: column;
            align-items: center; justify-content: center; padding: 15px; text-align: center;
        .content.active { display: flex; }
        .score { font-size: 38px; color: #f3ba2f; font-weight: bold; margin: 15px 0; }
        .tiger-btn {
            width: 160px; height: 160px; background: #2a1b0c;
            border: 5px solid #f3ba2f; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 70px; cursor: pointer; box-shadow: 0 0 25px rgba(243,186,47,0.5);
            transition: transform 0.1s;
        }
        .tiger-btn:active { transform: scale(0.9); }
        .mult-row { display: flex; gap: 8px; margin: 15px 0; }
        .m-btn {
            background: #151b2b; border: 1px solid #f3ba2f; color: #fff;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .m-btn.active { background: #f3ba2f; color: #000; }
        .nav {
            display: flex; justify-content: space-around;
            background: #121620; padding: 10px 0; border-top: 2px solid #1f293d;
        }
        .nav-b { background: none; border: none; color: #94a3b8; font-size: 14px; cursor: pointer; font-weight: bold; }
        .nav-b.active { color: #f3ba2f; }
        .action-box { background: #151b2b; border: 1px solid #22304a; padding: 15px; border-radius: 10px; width: 100%; max-width: 320px; }
        .btn-main { background: #f3ba2f; color: #000; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div>👑 Malak (Lvl <span id="lvl">1</span>)</div>
        <div style="color: #f3ba2f;">⚡ <span id="energy">1000</span>/1000</div>
    </div>

    <!-- Page Home -->
    <div id="p-home" class="content active">
        <div style="font-size: 14px; color: #94a3b8;">Total FZL Coins</div>
        <div class="score">🪙 <span id="score">0</span></div>

        <!-- Multipliers -->
        <div class="mult-row">
            <button class="m-btn active" id="mb1" onclick="setMult(1)">1X</button>
            <button class="m-btn" id="mb2" onclick="setMult(2)">2X</button>
            <button class="m-btn" id="mb3" onclick="setMult(3)">3X</button>
            <button class="m-btn" id="mb4" onclick="setMult(4)">4X</button>
        </div>

        <!-- Tiger Clicker -->
        <div class="tiger-btn" onclick="tapAction()">🐅</div>
        <p style="font-size: 12px; color: #94a3b8; margin-top: 15px;">स्क्रीन पर टाइगर पर टैप करें!</p>
    </div>

    <!-- Page Levels -->
    <div id="p-levels" class="content">
        <div class="action-box">
            <h3>⭐ लेवल अपग्रेड</h3>
            <p>अगला लेवल कॉस्ट: <span style="color:#f3ba2f">100,000 कॉइन्स</span></p>
            <button class="btn-main" onclick="upgradeLevel()">लेवल बढ़ाएं</button>
        </div>
    </div>

    <!-- Page Friends -->
    <div id="p-friends" class="content">
        <div class="action-box">
            <h3>👥 दोस्तों को जोड़ें</h3>
            <p style="font-size: 12px; color: #94a3b8;">हर इनवाइट पर 25,000 कॉइन्स पाएं!</p>
            <button class="btn-main" style="background:#229ed9; color:#fff;" onclick="alert('लिंक कॉपी हो गया!')">Telegram पर शेयर करें</button>
        </div>
    </div>

    <!-- Page Admin -->
    <div id="p-admin" class="content">
        <div class="action-box" style="border-color: #ef4444;">
            <h3 style="color:#ef4444">🛡️ एडमिन लॉग</h3>
            <input type="password" id="pin" placeholder="पिन डालें (786)" style="width:100%; padding:8px; background:#0b0e14; color:#fff; border:1px solid #444; border-radius:4px; margin-bottom:8px;">
            <button class="btn-main" style="background:#ef4444; color:#fff;" onclick="adminLogin()">लॉगिन करें</button>
        </div>
    </div>

    <!-- Footer Navigation -->
    <div class="nav">
        <button class="nav-b active" id="nb-home" onclick="navTo('home')">🪙 होम</button>
        <button class="nav-b" id="nb-levels" onclick="navTo('levels')">⭐ लेवल्स</button>
        <button class="nav-b" id="nb-friends" onclick="navTo('friends')">👥 फ्रेंड्स</button>
        <button class="nav-b" id="nb-admin" onclick="navTo('admin')">🛡️ एडमिन</button>
    </div>

    <script>
        let score = 0;
        let energy = 1000;
        let multiplier = 1;
        let level = 1;

        function navTo(page) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-b').forEach(b => b.classList.remove('active'));
            
            document.getElementById('p-' + page).classList.add('active');
            document.getElementById('nb-' + page).classList.add('active');
        }

        function setMult(val) {
            multiplier = val;
            document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('mb' + val).classList.add('active');
        }

        function tapAction() {
            let earn = 1 * multiplier;
            if (energy >= earn) {
                score += earn;
                energy -= earn;
                document.getElementById('score').innerText = score.toLocaleString();
                document.getElementById('energy').innerText = energy;
            } else {
                alert('एनर्जी खत्म हो गई है! कृपया थोड़ा इंतज़ार करें।');
            }
        }

        function upgradeLevel() {
            if (score >= 100000) {
                score -= 100000;
                level += 1;
                document.getElementById('score').innerText = score.toLocaleString();
                document.getElementById('lvl').innerText = level;
                alert('बधाई हो! आपका लेवल अपग्रेड हो गया है।');
            } else {
                alert('पर्याप्त कॉइन्स नहीं हैं!');
            }
        }

        function adminLogin() {
            let p = document.getElementById('pin').value;
            if (p === '786') {
                score += 500000;
                document.getElementById('score').innerText = score.toLocaleString();
                alert('सफलतापूर्वक 5,00,000 बोनस कॉइन्स जोड़ दिए गए हैं!');
            } else {
                alert('गलत पिन!');
            }
        }

        // ऑटो एनर्जी रीचार्ज
        setInterval(() => {
            if (energy < 1000) {
                energy += 10;
                if (energy > 1000) energy = 1000;
                document.getElementById('energy').innerText = energy;
            }
        }, 1000);
    </script>
</body>
</html>
