<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FZL Kombat - Direct Start</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f101d 50%, #06070a 100%);
            color: #ffffff;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        #startOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 11, 18, 0.98);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .start-btn {
            background: linear-gradient(135deg, #f3ba2f 0%, #e67e22 100%);
            color: #000;
            font-size: 22px;
            font-weight: 900;
            padding: 16px 45px;
            border-radius: 35px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(243, 186, 47, 0.8);
            margin-top: 20px;
        }
        .top-container {
            padding: 12px 15px;
            background: rgba(26, 29, 45, 0.9);
        }
        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-name {
            font-size: 14px;
            font-weight: 800;
            color: #ffd700;
        }
        .game-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .balance-container {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 20px;
            color: #f3ba2f;
        }
        .hamster-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #f3ba2f 0%, #b8860b 100%);
            box-shadow: 0 15px 40px rgba(184, 134, 11, 0.6);
            border: 6px solid #ffeaa7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            cursor: pointer;
        }
        .hamster-btn:active {
            transform: scale(0.9);
        }
        .nav-menu {
            display: flex;
            justify-content: space-around;
            background: rgba(18, 20, 32, 0.95);
            padding: 12px 0;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div id="startOverlay">
        <h1 style="color: #ffd700; font-size: 28px; margin-bottom: 10px;">🦁 FZL KOMBAT</h1>
        <p style="color: #94a3b8; font-size: 15px;">گیم شروع کرنے کے لیے نیچے بٹن پر کلک کریں:</p>
        <button class="start-btn" onclick="document.getElementById('startOverlay').style.display='none';">START GAME 🚀</button>
    </div>

    <div class="top-container">
        <div class="user-row">
            <span class="user-name">FZL CEO</span>
            <span style="color: #00ffcc; font-size: 12px;">Online</span>
        </div>
    </div>

    <div class="game-content">
        <div class="balance-container" id="scoreDisplay">1,250,400</div>
        <div class="hamster-btn" onclick="addScore()">🦁</div>
    </div>

    <div class="nav-menu">
        <button class="nav-item"><span>🪙</span><span>Exchange</span></button>
        <button class="nav-item"><span>⛏️</span><span>Mine</span></button>
        <button class="nav-item"><span>👥</span><span>Friends</span></button>
        <button class="nav-item"><span>🎁</span><span>Earn</span></button>
    </div>

    <script>
        let score = 1250400;
        function addScore() {
            score += 1;
            document.getElementById('scoreDisplay').innerText = score.toLocaleString();
        }
    </script>
</body>
                                            </html>
